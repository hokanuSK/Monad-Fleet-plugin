apiVersion: 1

providers:
  - name: Monad Fleet Static
    orgId: 1
    folder: Monad Fleet
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/static
      foldersFromFilesStructure: false
  - name: Monad Fleet Experiments
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/experiments
      foldersFromFilesStructure: true
