name: elabftw-aws

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: "/usr/bin/mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute 'SHOW DATABASES;'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elabftw}
      MYSQL_USER: ${MYSQL_USER:-elabftw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - elabftw-net

  web:
    image: ${ELAB_WEB_IMAGE:-elabftw/elabimg:5.3.11}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-elabftw}
      DB_USER: ${MYSQL_USER:-elabftw}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PHP_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      SECRET_KEY: ${ELAB_SECRET_KEY}
      SITE_URL: ${ELAB_SITE_URL}
      SERVER_NAME: ${ELAB_SERVER_NAME}
      DISABLE_HTTPS: "false"
      ENABLE_LETSENCRYPT: "false"
    ports:
      - "${ELAB_WEB_PORT:-9443}:443"
    volumes:
      - web-uploads:/elabftw/uploads
    networks:
      - elabftw-net

  reverse-proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      web:
        condition: service_started
      grafana:
        condition: service_started
      mimir:
        condition: service_started
      monad-fleet-service:
        condition: service_started
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
      ELAB_HOST: ${ELAB_HOST:-elab.example.com}
      GRAFANA_HOST: ${GRAFANA_HOST:-grafana.example.com}
      MIMIR_HOST: ${MIMIR_HOST:-mimir.example.com}
      FLEET_METRICS_HOST: ${FLEET_METRICS_HOST:-metrics.example.com}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/aws/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - elabftw-net

  monad-fleet-service:
    build:
      context: .
      dockerfile: infrastructure/aws/docker/fleet-service.Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      GATEWAY_PORT: 50060
      SCAN_CIDR: ${SCAN_CIDR:-172.20.0.0/16}
      ELAB_BASE_URL: "https://web/api/v2"
      FLEET_EXPERIMENT_TAG: ${FLEET_EXPERIMENT_TAG:-fleet}
      MAX_EXPERIMENTS_TO_SCAN: ${MAX_EXPERIMENTS_TO_SCAN:-20}
      HELLO_POLL_INTERVAL_S: ${HELLO_POLL_INTERVAL_S:-60}
      ENABLE_V2_DEVICE_STATE_PATCH: ${ENABLE_V2_DEVICE_STATE_PATCH:-false}
      DEVICE_ITEM_CACHE_TTL_S: ${DEVICE_ITEM_CACHE_TTL_S:-600}
      RESOURCE_TAG_PREFIX: ${RESOURCE_TAG_PREFIX:-device:}
      POLICY_METADATA_KEYS: ${POLICY_METADATA_KEYS:-fleet.policy,policy,fleet_policy,policy_json}
      ALLOW_LIVE_EVENTS: ${ALLOW_LIVE_EVENTS:-false}
      EVENT_DURATION_MINUTES: ${EVENT_DURATION_MINUTES:-180}
      BOOK_MAX_MINUTES: ${BOOK_MAX_MINUTES:-180}
      BOOK_CAN_OVERLAP: ${BOOK_CAN_OVERLAP:-true}
      BOOK_IS_CANCELLABLE: ${BOOK_IS_CANCELLABLE:-true}
      DATA_DIR: /data
      METRICS_PORT: 9108
      METRICS_EXCLUDE_PREFIXES: ${METRICS_EXCLUDE_PREFIXES:-}
      ENABLE_METRICS_INGEST_JOURNAL: ${ENABLE_METRICS_INGEST_JOURNAL:-false}
      ARTIFACT_MAX_BYTES: ${ARTIFACT_MAX_BYTES:-536870912}
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-}
      ELAB_API_KEY: ${ELAB_API_KEY}
      ELAB_REQUEST_TIMEOUT_S: ${ELAB_REQUEST_TIMEOUT_S:-180}
      DEVICE_INTERFACE_OVERRIDES_JSON: ${DEVICE_INTERFACE_OVERRIDES_JSON:-}
      GRAFANA_EXPERIMENT_DASHBOARDS_ENABLED: ${GRAFANA_EXPERIMENT_DASHBOARDS_ENABLED:-true}
      GRAFANA_EXPERIMENT_SCAN_INTERVAL_S: ${GRAFANA_EXPERIMENT_SCAN_INTERVAL_S:-300}
      GRAFANA_DASHBOARD_TEMPLATE_DIR: /etc/grafana/provisioning/dashboards/static
      GRAFANA_DASHBOARD_OUTPUT_ROOT: /etc/grafana/provisioning/dashboards/experiments
      GRAFANA_EXPERIMENT_INSTANCE_MAP: ${GRAFANA_EXPERIMENT_INSTANCE_MAP:-2c:cf:67:81:00:45=monad-01,24:eb:16:e3:6a:07=monad-02,2c:cf:67:80:f5:86=monad-03,2c:cf:67:80:f4:bf=monad-04}
    volumes:
      - fleet-data:/data
      - ./infrastructure/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - elabftw-net
    ports:
      - "${FLEET_GRPC_PORT:-50060}:50060"
      - "${FLEET_METRICS_PORT:-9108}:9108"

  model-device:
    build:
      context: .
      dockerfile: infrastructure/aws/docker/device-sim.Dockerfile
    restart: unless-stopped
    depends_on:
      monad-fleet-service:
        condition: service_started
    environment:
      DEVICE_MAC: ${MODEL_DEVICE_MAC:-02:42:ac:14:00:04}
      DEVICE_TYPE: ${MODEL_DEVICE_TYPE:-rpi-dualband}
      FLEET_MANAGER_HOST: monad-fleet-service
      FLEET_MANAGER_PORT: 50060
      MAX_SYNC_CYCLES: ${MODEL_DEVICE_MAX_SYNC_CYCLES:-0}
      EXECUTE_POLICY: ${MODEL_DEVICE_EXECUTE_POLICY:-false}
      DEFAULT_METRICS_SINKS: ${DEFAULT_METRICS_SINKS:-fleet_http}
    mac_address: ${MODEL_DEVICE_MAC:-02:42:ac:14:00:04}
    networks:
      - elabftw-net

  mimir:
    image: grafana/mimir:2.12.0
    restart: unless-stopped
    command:
      - "-config.file=/etc/mimir/mimir.yml"
      - "-target=all"
    volumes:
      - ./infrastructure/observability/mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/data
    ports:
      - "${MIMIR_PORT:-9009}:9009"
    networks:
      - elabftw-net

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    depends_on:
      monad-fleet-service:
        condition: service_started
      mimir:
        condition: service_started
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - elabftw-net

  grafana:
    image: grafana/grafana-oss:11.1.4
    restart: unless-stopped
    depends_on:
      mimir:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - elabftw-net

networks:
  elabftw-net:
    ipam:
      config:
        - subnet: ${ELAB_NETWORK_SUBNET:-172.20.0.0/16}

volumes:
  mysql-data:
  web-uploads:
  fleet-data:
  mimir-data:
  prometheus-data:
  grafana-data:
  caddy-data:
  caddy-config:
