name: elabftw-aws

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    healthcheck:
      test: "/usr/bin/mysql --user=$$MYSQL_USER --password=$$MYSQL_PASSWORD --execute 'SHOW DATABASES;'"
      interval: 10s
      timeout: 5s
      retries: 30
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-elabftw}
      MYSQL_USER: ${MYSQL_USER:-elabftw}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - elabftw-net

  web:
    image: ${ELAB_WEB_IMAGE:-elabftw/elabimg:5.3.11}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - FOWNER
      - DAC_OVERRIDE
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-elabftw}
      DB_USER: ${MYSQL_USER:-elabftw}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      PHP_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      SECRET_KEY: ${ELAB_SECRET_KEY}
      SITE_URL: ${ELAB_SITE_URL}
      SERVER_NAME: ${ELAB_SERVER_NAME}
      DISABLE_HTTPS: "false"
      ENABLE_LETSENCRYPT: "false"
    ports:
      - "${ELAB_WEB_PORT:-9443}:443"
    volumes:
      - web-uploads:/elabftw/uploads
    networks:
      - elabftw-net

  reverse-proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      web:
        condition: service_started
      grafana:
        condition: service_started
      mimir:
        condition: service_started
      monad-fleet-service:
        condition: service_started
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
      ELAB_HOST: ${ELAB_HOST:-elab.example.com}
      GRAFANA_HOST: ${GRAFANA_HOST:-grafana.example.com}
      MIMIR_HOST: ${MIMIR_HOST:-mimir.example.com}
      FLEET_METRICS_HOST: ${FLEET_METRICS_HOST:-metrics.example.com}
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./infrastructure/aws/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - elabftw-net

  monad-fleet-service:
    build:
      context: .
      dockerfile: infrastructure/aws/docker/fleet-service.Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      GATEWAY_PORT: 50060
      SCAN_CIDR: ${SCAN_CIDR:-172.20.0.0/16}
      ELAB_BASE_URL: "https://web/api/v2"
      FLEET_EXPERIMENT_TAG: ${FLEET_EXPERIMENT_TAG:-fleet}
      RESOURCE_TAG_PREFIX: ${RESOURCE_TAG_PREFIX:-device:}
      POLICY_METADATA_KEYS: ${POLICY_METADATA_KEYS:-fleet.policy,policy,fleet_policy,policy_json}
      ALLOW_LIVE_EVENTS: ${ALLOW_LIVE_EVENTS:-false}
      EVENT_DURATION_MINUTES: ${EVENT_DURATION_MINUTES:-180}
      BOOK_MAX_MINUTES: ${BOOK_MAX_MINUTES:-180}
      BOOK_CAN_OVERLAP: ${BOOK_CAN_OVERLAP:-true}
      BOOK_IS_CANCELLABLE: ${BOOK_IS_CANCELLABLE:-true}
      DATA_DIR: /data
      METRICS_PORT: 9108
      METRICS_EXCLUDE_PREFIXES: ${METRICS_EXCLUDE_PREFIXES:-csi_}
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-}
      ELAB_API_KEY: ${ELAB_API_KEY}
    volumes:
      - fleet-data:/data
    networks:
      - elabftw-net
    ports:
      - "${FLEET_GRPC_PORT:-50060}:50060"
      - "${FLEET_METRICS_PORT:-9108}:9108"

  model-device:
    build:
      context: .
      dockerfile: infrastructure/aws/docker/device-sim.Dockerfile
    restart: unless-stopped
    depends_on:
      monad-fleet-service:
        condition: service_started
    environment:
      DEVICE_MAC: ${MODEL_DEVICE_MAC:-02:42:ac:14:00:04}
      DEVICE_TYPE: ${MODEL_DEVICE_TYPE:-rpi-dualband}
      FLEET_MANAGER_HOST: monad-fleet-service
      FLEET_MANAGER_PORT: 50060
      MAX_SYNC_CYCLES: ${MODEL_DEVICE_MAX_SYNC_CYCLES:-0}
      EXECUTE_POLICY: ${MODEL_DEVICE_EXECUTE_POLICY:-false}
    mac_address: ${MODEL_DEVICE_MAC:-02:42:ac:14:00:04}
    networks:
      - elabftw-net

  mimir:
    image: grafana/mimir:2.12.0
    restart: unless-stopped
    command:
      - "-config.file=/etc/mimir/mimir.yml"
      - "-target=all"
    volumes:
      - ./infrastructure/observability/mimir/mimir.yml:/etc/mimir/mimir.yml:ro
      - mimir-data:/data
    ports:
      - "${MIMIR_PORT:-9009}:9009"
    networks:
      - elabftw-net

  grafana:
    image: grafana/grafana-oss:11.1.4
    restart: unless-stopped
    depends_on:
      mimir:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - elabftw-net

networks:
  elabftw-net:
    ipam:
      config:
        - subnet: ${ELAB_NETWORK_SUBNET:-172.20.0.0/16}

volumes:
  mysql-data:
  web-uploads:
  fleet-data:
  mimir-data:
  grafana-data:
  caddy-data:
  caddy-config:
