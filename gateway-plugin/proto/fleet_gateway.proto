syntax = "proto3";

package fleet;

// gRPC API medzi simulovaným zariadením a Fleet Gateway

service FleetGateway {
  rpc DiscoverByMac(DiscoverRequest) returns (DiscoverResponse);
}

message DiscoverRequest {
  string mac_address = 1;
}

message DiscoverResponse {
  bool success      = 1;
  string message    = 2;
  string mac_address = 3;
  string resource_id = 4;
}
