syntax = "proto3";

package fleet.v1;

service FleetManager {
  rpc Hello(AgentInfo) returns (ServerConfig);
  rpc GetPolicy(PolicyRequest) returns (PolicyResponse);
  rpc PublishEvent(Event) returns (Ack);
}

message AgentInfo {
  string device_id = 1;
  string agent_version = 2;
  string device_type = 3;
  map<string, string> capabilities = 4;
  int64 unix_time_ms = 5;
}

message ServerConfig {
  int64 server_unix_time_ms = 1;
  int32 poll_interval_s = 2;
  string required_min_agent_version = 3;
}

message PolicyRequest {
  string device_id = 1;
  string last_policy_revision = 2;
}

message PolicyResponse {
  bool not_modified = 1;
  string policy_revision = 2;
  bytes policy_json = 3;
}

message Event {
  string event_id = 1;
  string experiment_id = 2;
  string policy_revision = 3;
  string device_id = 4;
  int64 unix_time_ms = 5;
  string type = 6;
  string command_id = 7;
  int32 exit_code = 8;
  string stdout_tail = 9;
  string stderr_tail = 10;
  map<string, string> metrics = 11;
  map<string, string> artifacts = 12;
}

message Ack {
  bool ok = 1;
  string message = 2;
}
