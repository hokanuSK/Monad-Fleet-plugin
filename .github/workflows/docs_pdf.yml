name: Build TeX PDFs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**/*.tex"
      - ".github/workflows/docs_pdf.yml"
  pull_request:
    paths:
      - "docs/**/*.tex"
      - ".github/workflows/docs_pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-monad-fleet-grpc-spec:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs
          root_file: monad_fleet_grpc_interface_v2.tex
          args: -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: monad_fleet_grpc_interface_v2.pdf
          path: docs/monad_fleet_grpc_interface_v2.pdf

      - name: Commit PDF To Main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [[ -z "$(git status --porcelain docs/monad_fleet_grpc_interface_v2.pdf)" ]]; then
            echo "No PDF changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/monad_fleet_grpc_interface_v2.pdf
          git commit -m "docs: auto-generate monad_fleet_grpc_interface_v2.pdf"
          git push || echo "Push failed (branch protection?). PDF is still available as a workflow artifact."
