<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill:#f8fbff; }
      .title { font-size:18px; font-weight:bold; fill:#111827; }
      .box { fill:#eef4ff; stroke:#35589a; stroke-width:1.4; }
      .life { stroke:#9aa4b3; stroke-dasharray:5 5; stroke-width:1.1; }
      .msg { stroke:#1f2937; stroke-width:1.25; fill:none; marker-end:url(#arrow); }
      .ret { stroke:#4b5563; stroke-width:1.1; fill:none; stroke-dasharray:4 4; marker-end:url(#arrow); }
      .label { fill:#111827; }
      .note { fill:#fff9e8; stroke:#b08900; stroke-width:1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1220" height="720" class="bg"/>
  <text x="610" y="32" text-anchor="middle" class="title">Process A v2 - Pull Policy Flow (no iteration block)</text>

  <rect x="25" y="60" width="130" height="30" rx="5" class="box"/><text x="90" y="80" text-anchor="middle" class="label">Researcher</text>
  <rect x="235" y="60" width="130" height="30" rx="5" class="box"/><text x="300" y="80" text-anchor="middle" class="label">Web GUI</text>
  <rect x="485" y="60" width="130" height="30" rx="5" class="box"/><text x="550" y="80" text-anchor="middle" class="label">eLabFTW API</text>
  <rect x="740" y="60" width="180" height="30" rx="5" class="box"/><text x="830" y="80" text-anchor="middle" class="label">Monad Fleet service</text>
  <rect x="1015" y="60" width="130" height="30" rx="5" class="box"/><text x="1080" y="80" text-anchor="middle" class="label">Device</text>

  <line x1="90" y1="95" x2="90" y2="675" class="life"/>
  <line x1="300" y1="95" x2="300" y2="675" class="life"/>
  <line x1="550" y1="95" x2="550" y2="675" class="life"/>
  <line x1="830" y1="95" x2="830" y2="675" class="life"/>
  <line x1="1080" y1="95" x2="1080" y2="675" class="life"/>

  <line x1="90" y1="130" x2="300" y2="130" class="msg"/>
  <text x="195" y="122" text-anchor="middle" class="label">Create / update experiment</text>

  <line x1="300" y1="165" x2="550" y2="165" class="msg"/>
  <text x="425" y="157" text-anchor="middle" class="label">POST/PATCH /experiments/{id}</text>

  <line x1="300" y1="200" x2="550" y2="200" class="msg"/>
  <text x="425" y="192" text-anchor="middle" class="label">PATCH /experiments/{id} metadata.policy (JSON editor)</text>

  <line x1="300" y1="235" x2="550" y2="235" class="msg"/>
  <text x="425" y="227" text-anchor="middle" class="label">POST /experiments/{id}/tags (fleet, device:...)</text>

  <line x1="550" y1="270" x2="300" y2="270" class="ret"/>
  <text x="425" y="262" text-anchor="middle" class="label">200 / 201 OK</text>

  <line x1="1080" y1="310" x2="830" y2="310" class="msg"/>
  <text x="955" y="302" text-anchor="middle" class="label">gRPC GetPolicy(device_id, last_policy_revision)</text>

  <line x1="830" y1="345" x2="550" y2="345" class="msg"/>
  <text x="690" y="337" text-anchor="middle" class="label">GET /items?search=device_id</text>

  <line x1="550" y1="380" x2="830" y2="380" class="ret"/>
  <text x="690" y="372" text-anchor="middle" class="label">resource metadata + tags</text>

  <line x1="830" y1="415" x2="550" y2="415" class="msg"/>
  <text x="690" y="407" text-anchor="middle" class="label">GET /experiments?tags[]=fleet</text>

  <line x1="550" y1="450" x2="830" y2="450" class="ret"/>
  <text x="690" y="442" text-anchor="middle" class="label">candidate experiments</text>

  <rect x="690" y="468" width="280" height="42" rx="6" class="note"/>
  <text x="705" y="486" class="label">Service selects best matching experiment</text>
  <text x="705" y="502" class="label">(latest + selector match)</text>

  <line x1="830" y1="535" x2="550" y2="535" class="msg"/>
  <text x="690" y="527" text-anchor="middle" class="label">GET /experiments/{selected_id}</text>

  <line x1="550" y1="565" x2="830" y2="565" class="ret"/>
  <text x="690" y="557" text-anchor="middle" class="label">tags + metadata (includes policy)</text>

  <line x1="830" y1="595" x2="550" y2="595" class="msg"/>
  <text x="690" y="587" text-anchor="middle" class="label">GET /experiments/{selected_id} (read metadata policy)</text>

  <line x1="550" y1="625" x2="830" y2="625" class="ret"/>
  <text x="690" y="617" text-anchor="middle" class="label">policy JSON</text>

  <line x1="830" y1="655" x2="1080" y2="655" class="msg"/>
  <text x="955" y="647" text-anchor="middle" class="label">PolicyResponse(policy_revision, policy_json)</text>

  <rect x="980" y="575" width="190" height="44" rx="5" class="note"/>
  <text x="995" y="593" class="label">If revision unchanged:</text>
  <text x="995" y="609" class="label">not_modified=true</text>
</svg>
