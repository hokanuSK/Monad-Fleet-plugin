<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .box {fill:#eef3ff;stroke:#4a67b3;stroke-width:1.2;}
      .life {stroke:#888;stroke-dasharray:4 4;stroke-width:1;}
      .msg {stroke:#000;stroke-width:1.1;fill:none;marker-end:url(#arrow);}
      .label {font-size:12px;}
      .title {font-size:16px;font-weight:bold;}
      .loop {stroke:#444;stroke-width:1;fill:none;stroke-dasharray:5 3;}
      .alt {stroke:#444;stroke-width:1;fill:none;stroke-dasharray:6 2;}
    </style>
  </defs>

  <text x="490" y="24" text-anchor="middle" class="title">Proces B - Registracia zariadenia, vykonanie prikazov, zapis stavu</text>

  <!-- Participants -->
  <rect x="45"  y="45" width="90"  height="26" rx="4" class="box"/><text x="90"  y="63" text-anchor="middle" class="label">Device</text>
  <rect x="305" y="45" width="170" height="26" rx="4" class="box"/><text x="390" y="63" text-anchor="middle" class="label">Monad Fleet service</text>
  <rect x="635" y="45" width="130" height="26" rx="4" class="box"/><text x="700" y="63" text-anchor="middle" class="label">eLabFTW API</text>

  <!-- Lifelines -->
  <line x1="90"  y1="71" x2="90"  y2="575" class="life"/>
  <line x1="390" y1="71" x2="390" y2="575" class="life"/>
  <line x1="700" y1="71" x2="700" y2="575" class="life"/>

  <!-- Hello path -->
  <line x1="90" y1="120" x2="390" y2="120" class="msg"/><text x="240" y="112" text-anchor="middle">gRPC Hello(device_id, capabilities)</text>
  <line x1="390" y1="150" x2="700" y2="150" class="msg"/><text x="545" y="142" text-anchor="middle">GET /items?search=device_id</text>
  <line x1="700" y1="175" x2="390" y2="175" class="msg"/><text x="545" y="167" text-anchor="middle">resource alebo prazdny zoznam</text>

  <rect x="250" y="195" width="500" height="105" class="alt" rx="6"/>
  <text x="265" y="213" class="label">alt</text>
  <text x="295" y="228" class="label">[resource neexistuje]</text>
  <line x1="390" y1="240" x2="700" y2="240" class="msg"/><text x="545" y="232" text-anchor="middle">POST /items (device_id plus mac_address)</text>
  <text x="295" y="263" class="label">[resource existuje]</text>
  <line x1="390" y1="275" x2="700" y2="275" class="msg"/><text x="545" y="267" text-anchor="middle">PATCH /items/{id} metadata alebo body (last_seen_at)</text>

  <line x1="700" y1="315" x2="390" y2="315" class="msg"/><text x="545" y="307" text-anchor="middle">200 or 201 OK</text>
  <line x1="390" y1="340" x2="90"  y2="340" class="msg"/><text x="240" y="332" text-anchor="middle">ServerConfig(poll_interval_s, server_time)</text>

  <!-- Execute and publish loop -->
  <rect x="120" y="365" width="700" height="185" class="loop" rx="6"/>
  <text x="140" y="383" class="label">loop pre kazdy execution event (COMMAND_STARTED, COMMAND_FINISHED, ERROR, ARTIFACT_UPLOADED)</text>

  <line x1="90" y1="405" x2="390" y2="405" class="msg"/><text x="240" y="397" text-anchor="middle">gRPC PublishEvent(event_id, experiment_id, policy_revision, ...)</text>
  <line x1="390" y1="430" x2="700" y2="430" class="msg"/><text x="545" y="422" text-anchor="middle">prvy event: POST /events/{item} (vytvori run event)</text>
  <line x1="700" y1="455" x2="390" y2="455" class="msg"/><text x="545" y="447" text-anchor="middle">201 Created (event id)</text>
  <line x1="390" y1="480" x2="700" y2="480" class="msg"/><text x="545" y="472" text-anchor="middle">PATCH /event/{id} metadata (status, history, summary)</text>
  <line x1="700" y1="505" x2="390" y2="505" class="msg"/><text x="545" y="497" text-anchor="middle">200 OK</text>
  <line x1="390" y1="530" x2="90"  y2="530" class="msg"/><text x="240" y="522" text-anchor="middle">Ack(ok=true)</text>

  <line x1="90" y1="560" x2="390" y2="560" class="msg"/><text x="240" y="552" text-anchor="middle">final event: metrics.run_state = COMPLETED alebo PARTIAL</text>
</svg>
