@startuml
title Proces A - Vytvorenie/úprava Experimentu a generovanie Events

actor Researcher
participant "Web GUI" as GUI
participant "eLabFTW API" as API
participant "Monad Fleet plugin" as Plugin

Researcher -> GUI: Vytvorí / upraví Experiment\n(vrátane custom JSON)
GUI -> API: POST /experiments\nalebo PATCH /experiments/{id}
API - -> GUI: 200 OK

... o niečo neskôr ...

Plugin -> API: GET /experiments?modified_since=...
API - -> Plugin: experiments (JSON)

loop Pre každý nový/zmenený Experiment
  Plugin -> API: GET /experiments/{id}
  API - -> Plugin: experiment + tags + custom JSON

  Plugin -> API: GET /items?tags={experiment.tags}
  API - -> Plugin: resources (zariadenia)

  Plugin -> Plugin: Pre každý Resource s rovnakým tagom\nvypočítaj a vytvor Event

  Plugin -> API: POST /events\n(Event s JSON stavom)
  API - -> Plugin: 201 Created
end
@enduml

